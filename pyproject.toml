[project]
name = "ai-agent-data-lab"
version = "1.0.0"
description = "Připravené prostředí pro analýzu dat s AI agentem (Python, uv, DuckDB, AGENTS.md)"
readme = "README.md"
requires-python = ">=3.12"
# Konkrétní verze drží uv.lock. Aktualizace: uv lock --upgrade && uv sync
dependencies = [
    "duckdb",
    "pandas",
    "pyarrow",
    "numpy",
    "scipy",
    "matplotlib",
    "requests",
    "pyyaml",
    "pytest",
    "tzdata",
]

[tool.uv]
package = false
